<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro | HelpDesk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="navbar-brand">Help<span>Desk</span></a>
</nav>
<main class="container container-form">
  <div class="card">
    <h1>Criar conta</h1>
    <div id="mensagem-erro" class="alert alert-erro"></div>
    <div id="mensagem-sucesso" class="alert alert-sucesso"></div>
    <form id="form-cadastro">
      <label for="nome">Nome</label>
      <input type="text" id="nome" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" minlength="6" required>
      <label for="tipo">Tipo de conta</label>
      <select id="tipo" required>
        <option value="cliente">Cliente</option>
        <option value="tecnico">Tecnico</option>
      </select>
      <button type="submit" class="btn btn-primary btn-full">Cadastrar</button>
    </form>
    <p class="form-footer">Ja tem conta? <a href="login.html">Entrar</a></p>
  </div>
</main>
<footer class="footer">HelpDesk &copy; 2026 - Suporte Tecnico</footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
