<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | HelpDesk</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar">
  <a href="index.html" class="navbar-brand">Help<span>Desk</span></a>
</nav>
<main class="container container-form">
  <div class="card">
    <h1>Entrar</h1>
    <div id="mensagem-erro" class="alert alert-erro"></div>
    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="senha">Senha</label>
      <input type="password" id="senha" required>
      <button type="submit" class="btn btn-primary btn-full">Entrar</button>
    </form>
    <p class="form-footer">Nao tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
</main>
<footer class="footer">HelpDesk &copy; 2026 - Suporte Tecnico</footer>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
